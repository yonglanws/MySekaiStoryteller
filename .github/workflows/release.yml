name: Build and Release

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'src/**/*'
      - 'package.json'
  workflow_dispatch:

jobs:
  build:
    name: Build Host Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci

      - name: Build webrenderer and host
        run: |
          npm run build:web
          npm run build:host

      - name: Pack deployable bundle
        run: |
          mkdir -p bundle
          cp -r out out-host bundle/
          cp -r user-configs bundle/ 2>/dev/null || true
          cp package.json package-lock.json README.md bundle/ 2>/dev/null || true
          tar -czf mysekai-storyteller-api-host-${GITHUB_REF_NAME}.tar.gz -C bundle .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: host-bundle
          path: mysekai-storyteller-api-host-*.tar.gz
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          path: build-artifacts
          merge-multiple: true

      - name: Determine if prerelease
        id: pre
        run: |
          if [[ "${GITHUB_REF_NAME}" == *"-rc"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: MySekaiStoryteller-API Host ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ steps.pre.outputs.is_prerelease }}
          files: build-artifacts/*
