name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  check-and-build:
    name: Check and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: |
          npm run typecheck
          npm run lint

      - name: Build webrenderer and host
        run: |
          npm run build:web
          npm run build:host

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: host-build
          retention-days: 7
          path: |
            out/**
            out-host/**
          if-no-files-found: error
